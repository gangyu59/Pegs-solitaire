<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pegs Solitaire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(reg => {
                    console.log('Service Worker Registered');
                    // Force update check on every page load
                    reg.update();
                })
                .catch(error => console.error('Service Worker Registration failed:', error));
        }
    </script>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pegs Solitaire</h1>

        <div id="game-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="controls-panel">
            <div id="controls">
                <label for="difficulty-slider">难度：<span id="difficulty-label">超易</span></label>
                <input type="range" id="difficulty-slider" class="slider" min="1" max="5" value="1">
            </div>
        </div>

        <div id="buttons">
            <button id="start-button">🎮 开始</button>
            <button id="rules-button">📖 规则</button>
        </div>

        <div class="stats-bar">
            <div id="move-counter">步数: 0</div>
        </div>
        <div id="message"></div>

        <!-- Rules modal -->
        <div id="rules-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>游戏规则</h2>
                <p>通过跳过并移除棋子，最终使棋盘上只剩一个棋子！</p>
                <ul>
                    <li>点击棋子选中（高亮显示），再点击空格使棋子跳过中间棋子，中间棋子被移除。</li>
                    <li>只能上下左右跳，不能斜跳。</li>
                    <li>继续跳动并移除棋子，直到无法移动或只剩一个棋子为止。</li>
                    <li>剩余棋子越少，分数越高！</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
